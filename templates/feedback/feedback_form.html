{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Give Feedback - Bishanil Dental & Eye Care{% endblock %}

{% block content %}
<section class="feedback-form-section">
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h1>Share Your Experience</h1>
                <p>Your feedback helps us serve you better</p>
            </div>
            
            <div class="feedback-type-selector">
                <button class="type-btn active" onclick="selectType('clinic')">
                    <i class="fas fa-building"></i> Clinic Feedback
                </button>
                <button class="type-btn" onclick="selectType('doctor')">
                    <i class="fas fa-user-md"></i> Doctor Feedback
                </button>
            </div>
            
            <!-- Clinic Feedback Form -->
            <form id="clinic-form" method="POST" action="{% url 'feedback:submit_clinic_feedback' %}" class="feedback-form active">
                {% csrf_token %}
                <div class="form-group">
                    <div class="form-row">
                        <div class="form-field">
                            <label>Your Name <span class="required">*</span></label>
                            <input type="text" name="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-field">
                            <label>Email</label>
                            <input type="email" name="email" placeholder="your@email.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>Phone Number</label>
                            <input type="tel" name="phone" placeholder="98XXXXXXXX">
                        </div>
                        <div class="form-field">
                            <label>Topic / Subject</label>
                            <input type="text" name="topic" placeholder="e.g., Cleanliness, Staff Behavior, Treatment">
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Your Rating <span class="required">*</span></label>
                        <div class="rating-input">
                            <input type="radio" name="rating" value="5" id="star5" checked><label for="star5">★</label>
                            <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
                            <input type="radio" name="rating" value="3" id="star3"><label for="star3">★</label>
                            <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
                            <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
                        </div>
                    </div>
                    <div class="form-field">
                        <label>Your Feedback <span class="required">*</span></label>
                        <textarea name="feedback_text" rows="5" placeholder="Please share your experience with us..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Submit Feedback</button>
                </div>
            </form>
            
          <!-- Doctor Feedback Form -->
<form id="doctor-form" method="POST" action="{% url 'feedback:submit_doctor_feedback' 0 %}" class="feedback-form">
    {% csrf_token %}
    <div class="form-group">
        <div class="form-row">
            <div class="form-field">
                <label>Your Name <span class="required">*</span></label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-field">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-field">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="98XXXXXXXX">
            </div>
            <div class="form-field">
                <label>Select Doctor <span class="required">*</span></label>
                <select name="doctor_id" id="doctor-select" required>
                    <option value="">-- Select Doctor --</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">Dr. {{ doctor.name }} - {{ doctor.specialization }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-field">
                <label>Treatment Received</label>
                <input type="text" name="treatment_received" placeholder="e.g., Root Canal, LASIK, Checkup">
            </div>
            <div class="form-field">
                <label>Appointment Date</label>
                <input type="date" name="appointment_date">
            </div>
        </div>
        
        <div class="form-field">
            <label>Your Rating <span class="required">*</span></label>
            <div class="rating-input">
                <input type="radio" name="rating" value="5" id="dstar5"><label for="dstar5">★</label>
                <input type="radio" name="rating" value="4" id="dstar4"><label for="dstar4">★</label>
                <input type="radio" name="rating" value="3" id="dstar3"><label for="dstar3">★</label>
                <input type="radio" name="rating" value="2" id="dstar2"><label for="dstar2">★</label>
                <input type="radio" name="rating" value="1" id="dstar1" checked><label for="dstar1">★</label>
            </div>
        </div>
        
        <div class="form-field">
            <label>Your Feedback <span class="required">*</span></label>
            <textarea name="feedback_text" rows="5" placeholder="Please share your experience with the doctor..." required></textarea>
        </div>
        
        <button type="submit" class="btn-primary">Submit Feedback</button>
    </div>
</form>
        </div>
    </div>
</form>

<style>
    .feedback-form-section {
        padding: 60px 0;
        background: var(--gray-light);
        min-height: 80vh;
    }
    
    .form-container {
        max-width: 700px;
        margin: 0 auto;
        background: var(--white);
        border-radius: 20px;
        padding: 40px;
        box-shadow: var(--shadow-md);
    }
    
    .form-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .form-header h1 {
        color: var(--teal);
        margin-bottom: 10px;
    }
    
    .feedback-type-selector {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
        justify-content: center;
    }
    
    .type-btn {
        padding: 10px 25px;
        background: var(--gray-light);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s;
    }
    
    .type-btn.active {
        background: var(--teal);
        color: white;
    }
    
    .feedback-form {
        display: none;
    }
    
    .feedback-form.active {
        display: block;
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    
    .form-field {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }
    
    .form-field label {
        font-weight: 500;
        margin-bottom: 8px;
    }
    
    .required {
        color: #ff6b6b;
    }
    
    .form-field input, .form-field select, .form-field textarea {
        padding: 12px 15px;
        border: 1px solid var(--gray-medium);
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.95rem;
    }
    
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
        outline: none;
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(38,166,154,0.1);
    }
    
    .rating-input {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
        gap: 5px;
    }
    
    .rating-input input {
        display: none;
    }
    
    .rating-input label {
        font-size: 2rem;
        color: #ddd;
        cursor: pointer;
        transition: color 0.2s;
    }
    
    .rating-input input:checked ~ label,
    .rating-input label:hover,
    .rating-input label:hover ~ label {
        color: #ffc107;
    }
    /* Doctor Form Specific */
#doctor-form select {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid var(--gray-medium);
    border-radius: 10px;
    background: white;
    cursor: pointer;
}

#doctor-form select:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(38,166,154,0.1);
}

#doctor-form input[type="date"] {
    cursor: pointer;
}

/* Rating Stars - Make sure they work properly */
.rating-input {
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-end;
    gap: 8px;
}

.rating-input input {
    display: none;
}

.rating-input label {
    font-size: 28px;
    color: #ddd;
    cursor: pointer;
    transition: color 0.2s;
}

.rating-input input:checked ~ label,
.rating-input label:hover,
.rating-input label:hover ~ label {
    color: #ffc107;
}

/* Responsive */
@media (max-width: 768px) {
    .rating-input label {
        font-size: 24px;
    }
    
    #doctor-form select {
        font-size: 14px;
    }
}
    
    @media (max-width: 768px) {
        .form-container {
            padding: 25px;
            margin: 0 20px;
        }
        
        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }
        
        .feedback-type-selector {
            flex-direction: column;
            align-items: center;
        }
        
        .type-btn {
            width: 200px;
        }
    }
</style>

<script>
    function selectType(type) {
        // Update buttons
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // Update forms
        if (type === 'clinic') {
            document.getElementById('clinic-form').classList.add('active');
            document.getElementById('doctor-form').classList.remove('active');
        } else {
            document.getElementById('clinic-form').classList.remove('active');
            document.getElementById('doctor-form').classList.add('active');
        }
    }
    
    // Update doctor form action when doctor is selected
    document.getElementById('doctor-select')?.addEventListener('change', function() {
        const doctorId = this.value;
        const doctorForm = document.getElementById('doctor-form');
        if (doctorId) {
            doctorForm.action = `/feedback/doctor/${doctorId}/`;
        }
    });
</script>
{% endblock %}
